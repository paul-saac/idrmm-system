# Build on GitHub; server credentials are configured in Azure App Service.
name: Build and deploy IDRMM to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: azure-idrmm-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Check public build settings
        shell: bash
        run: |
          for setting in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY NEXT_PUBLIC_SITE_URL; do
            if [[ -z "${!setting}" ]]; then
              echo "::error::Add the repository variable $setting under Settings > Secrets and variables > Actions > Variables."
              exit 1
            fi
          done
          node --input-type=module <<'NODE'
          for (const setting of ['NEXT_PUBLIC_SUPABASE_URL', 'NEXT_PUBLIC_SITE_URL']) {
            let valid = false;
            try {
              const url = new URL(process.env[setting]);
              valid = url.protocol === 'https:' && url.hostname !== 'portal.azure.com';
            } catch { /* Report the setting name without logging its value. */ }
            if (!valid) throw new Error(`${setting} must be a valid public HTTPS URL, not the Azure management portal URL.`);
          }
          NODE

      - name: Install locked dependencies
        # gantt-task-react declares a React 18 peer; this project uses React 19.
        # npm ci still verifies package-lock.json and runs our Gantt postinstall patch.
        run: npm ci --legacy-peer-deps

      - name: Build production app
        run: npm run build

      - name: Check backup WebJob package
        shell: bash
        run: |
          bash -n App_Data/jobs/continuous/idrmm-backup/run.sh
          bash -n App_Data/jobs/continuous/idrmm-backup/install-tools.sh
          chmod +x App_Data/jobs/continuous/idrmm-backup/*.sh
          openssl x509 -in App_Data/jobs/continuous/idrmm-backup/supabase-ca.crt -noout -checkend 0
          node --test scripts/azure-backup-webjob.test.mjs

      - name: Package production files
        # A tar archive preserves .next, node_modules/.bin, permissions and symlinks.
        # Only the listed runtime paths are included; .env and .git are not uploaded.
        shell: bash
        run: |
          test -f .next/BUILD_ID
          test -d .next/server/app
          test -d .next/static
          tar --exclude='.next/cache' --exclude='.next/dev' --exclude='.env*' --exclude='*.idrmm' \
            -czf release.tar.gz \
            .next node_modules public package.json package-lock.json \
            next.config.ts tsconfig.json scripts lib/backups supabase/migrations App_Data

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.tar.gz
          if-no-files-found: error
          compression-level: 0

  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Extract production files
        run: |
          mkdir app
          tar -xzf release.tar.gz -C app
          test -f app/.next/BUILD_ID
          test -f app/node_modules/next/dist/bin/next

      - name: Login to Azure
        uses: azure/login@v2
        with:
          # Keep the identity references generated by Azure Deployment Center.
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_6AB1BF15716A4652BAB22A06D2FCD63F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_474F9EEF9CFF45FABE873F552E308E6C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_CA3027DD924844218BE2D7825F315F9F }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: idrmm-system
          slot-name: Production
          package: app
          startup-command: npm start
